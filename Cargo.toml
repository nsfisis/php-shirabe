[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/nsfisis/php-shirabe"
license = "MIT"

[workspace.dependencies]
shirabe = { path = "crates/shirabe" }
shirabe-ca-bundle = { path = "crates/shirabe-ca-bundle" }
shirabe-class-map-generator = { path = "crates/shirabe-class-map-generator" }
shirabe-metadata-minifier = { path = "crates/shirabe-metadata-minifier" }
shirabe-php-rpc = { path = "crates/shirabe-php-rpc" }
shirabe-php-shim = { path = "crates/shirabe-php-shim" }
shirabe-php-shim-macros = { path = "crates/shirabe-php-shim-macros" }
shirabe-php-src = { path = "crates/shirabe-php-src" }
shirabe-seld-json-lint = { path = "crates/shirabe-seld-json-lint" }
shirabe-semver = { path = "crates/shirabe-semver" }
shirabe-spdx-licenses = { path = "crates/shirabe-spdx-licenses" }
shirabe-symfony-console = { path = "crates/shirabe-symfony-console" }
shirabe-symfony-filesystem = { path = "crates/shirabe-symfony-filesystem" }
shirabe-symfony-finder = { path = "crates/shirabe-symfony-finder" }
shirabe-symfony-process = { path = "crates/shirabe-symfony-process" }
shirabe-symfony-string = { path = "crates/shirabe-symfony-string" }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bstr = "1.13.1"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
fastrand = "2.5.0"
flate2 = "1.1.10"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
jsonschema = { version = "0.46.10", default-features = false }
md5 = "0.8.1"
memchr = "2.8.3"
mimalloc = "0.1.52"
mockall = "0.15.0"
nix = { version = "0.31.3", features = ["feature", "fs", "poll", "process", "sched", "signal", "user"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "brotli", "deflate", "gzip", "zstd"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serial_test = "4.0.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
syn = { version = "3.0.9", features = ["full"] }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
twox-hash = "2.1.5"
tzfile = "0.1.3"
url = "2.5.8"
zip = "9.3.0"

[workspace.lints.rust]
async_fn_in_trait = "allow"
dead_code = "allow"
redundant_imports = "warn"
unreachable_code = "allow"
unused_must_use = "allow"
unused_variables = "allow"

[workspace.lints.clippy]
await_holding_refcell_ref = "allow"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
diverging_sub_expression = "allow"
if_same_then_else = "allow"
large_enum_variant = "allow"
module_inception = "allow"
multiple_inherent_impl = "warn"
type_complexity = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "debuginfo"

[patch.crates-io]
bstr = { git = "https://github.com/nsfisis/bstr", branch = "php-shirabe" }
