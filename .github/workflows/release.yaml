name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  # Builds and checks the release archives without publishing them.
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - scripts/release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.5"
          tools: composer
          coverage: none

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - run: rustup target add "$TARGET"

      - name: Install the Composer runtime bundle sources
        run: |
          COMPOSER_ROOT_VERSION="$(sed -n "s/^ *public const VERSION = '\(.*\)';$/\1/p" composer/src/Composer/Composer.php)"
          export COMPOSER_ROOT_VERSION
          composer install --no-dev --no-interaction --no-progress --working-dir=composer

      - run: cargo build --release --locked --target "$TARGET" -p shirabe --bin shirabe

      - name: Check linkage
        run: |
          bin="target/$TARGET/release/shirabe"
          file "$bin"
          if [[ "$RUNNER_OS" == Linux ]]; then
            readelf --program-headers --wide "$bin"
            readelf --dynamic --wide "$bin"
            if readelf --program-headers --wide "$bin" | grep --quiet INTERP; then
              echo "the executable requests a dynamic loader" >&2
              exit 1
            fi
            if readelf --dynamic --wide "$bin" | grep --quiet NEEDED; then
              echo "the executable links shared libraries" >&2
              exit 1
            fi
          else
            otool -L "$bin"
            if otool -L "$bin" | tail -n +2 | grep --invert-match --quiet --extended-regexp '^\s+/(usr/lib|System/Library)/'; then
              echo "the executable links libraries outside the system" >&2
              exit 1
            fi
          fi

      - run: scripts/release/smoke-test "target/$TARGET/release/shirabe"

      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-about@0.9.3

      - run: >-
          cargo about generate --locked --fail
          --manifest-path crates/shirabe/Cargo.toml
          --config scripts/release/about.toml
          --output-file THIRD-PARTY-LICENSES
          scripts/release/third-party-licenses.hbs

      - name: Package
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "shirabe") | .version')"
          name="shirabe-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/shirabe" LICENSE.md THIRD-PARTY-LICENSES README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "shirabe") | .version')"
          if [[ "$version" != "$TAG" ]]; then
            echo "the tag $TAG does not match the version $version" >&2
            exit 1
          fi
          if [[ "$version" == *-dev* ]]; then
            echo "$version is a development version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Extract the release notes
        run: |
          # Release headings read like `## v0.1.0 (based on Composer 2.9.7)`.
          awk -v heading="## v$TAG" '
            !found && ($0 == heading || index($0, heading " ") == 1) { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi

      # With immutable releases, a release can no longer change once published. Upload every
      # asset to a draft first so that the published release is complete.
      - run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file release-notes.md
      - run: gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256
      - run: gh release edit "$TAG" --draft=false
